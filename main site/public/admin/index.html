<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Altis Voyage</title>
    <meta name="description" content="Manage enquiries, packages, offers, articles and site content." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#060f1e" />
    <script>(function(){try{var t=localStorage.getItem('altis-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f6f3ec':'#060f1e'}catch(e){}})()</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css?v=20261024" />
    <link rel="stylesheet" href="/css/admin.css?v=20261024" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
  </head>
  <body class="adm">
    <a class="skip-link" href="#adm-view">Skip to content</a>
    <div class="adm-shell">
      <aside class="adm-sidebar" id="adm-sidebar" aria-label="Dashboard navigation">
        <a class="adm-brand" href="#/overview" aria-label="Dashboard home">
          <img src="/logo-header.jpg" alt="Altis Voyage" width="174" height="72" />
        </a>
        <nav class="adm-nav" id="adm-nav" aria-label="Sections"></nav>
        <div class="adm-side-foot">
          <div class="adm-user">
            <span class="adm-avatar" id="adm-avatar" aria-hidden="true">·</span>
            <span class="adm-user-text"><b>Signed in</b><small id="admin-status">Loading…</small></span>
          </div>
          <a class="adm-side-link" href="/" target="_blank" rel="noopener">View site <span aria-hidden="true">↗</span></a>
          <button class="adm-side-link" id="admin-logout" type="button">Sign out</button>
        </div>
      </aside>
      <div class="adm-scrim" id="adm-scrim" hidden></div>

      <div class="adm-main">
        <header class="adm-topbar">
          <button class="adm-icon-btn adm-burger" id="adm-burger" type="button" aria-label="Open menu" aria-controls="adm-sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <div class="adm-crumb"><small>Altis Voyage</small><b id="adm-title">Dashboard</b></div>
          <label class="adm-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span class="visually-hidden">Search</span>
            <input id="adm-search" type="search" placeholder="Search…" autocomplete="off" />
            <kbd aria-hidden="true">/</kbd>
          </label>
          <div class="adm-actions" id="adm-actions"></div>
          <button class="adm-icon-btn" type="button" data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
        </header>
        <main class="adm-view" id="adm-view" tabindex="-1"></main>
      </div>
    </div>

    <div id="adm-drawer-root"></div>
    <div class="adm-toasts" id="adm-toasts" aria-live="polite" aria-atomic="false"></div>
    <dialog class="adm-dialog" id="adm-confirm" aria-labelledby="adm-confirm-title">
      <form method="dialog">
        <h2 id="adm-confirm-title" class="font-display"></h2>
        <p id="adm-confirm-text"></p>
        <div class="adm-dialog-actions">
          <button class="adm-btn" value="cancel" type="submit">Cancel</button>
          <button class="adm-btn primary" value="ok" type="submit" id="adm-confirm-ok">Confirm</button>
        </div>
      </form>
    </dialog>
    <noscript><p class="adm-noscript">The dashboard needs JavaScript. Please enable it and reload.</p></noscript>
    <script src="/js/admin.js?v=20261024" defer></script>
  </body>
</html>
