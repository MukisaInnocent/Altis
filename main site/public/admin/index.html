<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Altis Voyage</title>
    <meta name="description" content="Manage destinations, packages, services, gallery, site content and inquiries." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bitter:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <!-- Sidebar Navigation -->
      <aside class="admin-sidebar">
        <a href="/" class="admin-brand" aria-label="Altis Voyage home">
          <img src="/logo.jpg" alt="Altis Voyage" class="brand-logo" />
        </a>
        
        <div id="admin-status" class="admin-status-text">Loading session…</div>
        
        <nav class="dashboard-nav">
          <button class="nav-tab-button active" type="button" data-admin-tab="destinations">Destinations</button>
          <button class="nav-tab-button" type="button" data-admin-tab="packages">Packages</button>
          <button class="nav-tab-button" type="button" data-admin-tab="services">Services</button>
          <button class="nav-tab-button" type="button" data-admin-tab="testimonials">Testimonials</button>
          <button class="nav-tab-button" type="button" data-admin-tab="gallery">Gallery</button>
          <button class="nav-tab-button" type="button" data-admin-tab="site_content">Site content</button>
          <button class="nav-tab-button" type="button" data-admin-tab="inquiries">Inquiries</button>
        </nav>
        
        <div class="admin-sidebar-footer">
           <button id="admin-logout" class="button secondary full-width btn-modern" type="button">Sign Out</button>
           <a href="/" class="back-link">← View Public Site</a>
        </div>
      </aside>
      
      <!-- Main Content Area -->
      <main class="admin-main">
        <header class="admin-header">
           <p class="caption-num text-accent">Dashboard</p>
           <h1 class="font-display">Content Management</h1>
        </header>
        
        <div class="admin-content-wrapper">
           <div id="admin-content"></div>
        </div>
      </main>
    </div>
    
    <script src="/js/app.js"></script>
  </body>
</html>
