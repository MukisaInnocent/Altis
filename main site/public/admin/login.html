<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Sign In — Altis Voyage</title>
    <meta name="description" content="Administrator sign in for the Altis Voyage content dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bitter:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-body">
    <main class="admin-login-wrapper">
      <div class="login-glass-card">
        <div class="login-brand-logo">
          <img src="/logo.jpg" alt="Altis Voyage" class="brand-logo" />
        </div>
        <h1 class="font-display">Welcome Back</h1>
        <p class="login-subtitle">Sign in to manage the Altis Voyage platform</p>
        
        <form id="admin-login-form" class="admin-form">
          <div class="input-group">
            <label>Email Address</label>
            <input name="email" type="email" required value="admin@altistravels.com" placeholder="Enter your email" />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input name="password" type="password" required placeholder="Enter your password" />
          </div>
          <button class="button primary full-width btn-modern" type="submit">Sign In to Dashboard</button>
        </form>
        
        <a href="/" class="back-link">← Return to public site</a>
      </div>
    </main>
    <script src="/js/app.js"></script>
  </body>
</html>
