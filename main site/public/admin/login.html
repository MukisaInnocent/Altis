<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Sign In — Altis Voyage</title>
    <meta name="description" content="Administrator sign in for the Altis Voyage content dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bitter:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <main class="section admin-shell">
      <div class="login-card brackets">
        <div class="login-brand">
          <img src="/logo.jpg" alt="Altis Voyage" class="brand-logo" />
        </div>
        <h1 class="section-heading font-display">Staff sign in</h1>
        <form id="admin-login-form" class="admin-form">
          <label>Email<input name="email" type="email" required value="admin@altistravels.com" /></label>
          <label>Password<input name="password" type="password" required value="admin123" /></label>
          <button class="button primary full-width" type="submit">Sign in</button>
        </form>
        <a href="/" class="back-link">← Back to the site</a>
      </div>
    </main>
    <script src="/js/app.js"></script>
  </body>
</html>
