<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destinations — Altis Voyage</title>
    <meta name="description" content="Uganda safaris, East African escapes and international destinations — Dubai, Paris, Istanbul, London and more, planned by a Ugandan agency." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bitter:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="/" class="brand" aria-label="Altis Voyage home">
          <img src="/logo.jpg" alt="Altis Voyage" class="brand-logo" />
        </a>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/destinations.html">Destinations</a>
          <a href="/store.html">Tours &amp; Bookings</a>
          <a href="/inquiry.html">Plan Your Trip</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section alt-panel">
        <div class="container">
          <p class="caption-num text-accent">Destinations</p>
          <h1 class="section-heading font-display">The map, our way</h1>
          <p class="lede">From gorilla highlands to Gulf skylines. Filter by region or search — every journey includes planning, documentation guidance and support while you travel.</p>
          <div class="destinations-toolbar">
            <div class="region-tabs" aria-label="Destination regions">
              <button class="region-pill active" type="button" data-region="all">All</button>
              <button class="region-pill" type="button" data-region="uganda">Uganda</button>
              <button class="region-pill" type="button" data-region="east-africa">East Africa</button>
              <button class="region-pill" type="button" data-region="international">International</button>
            </div>
            <input id="destination-search" type="search" placeholder="Search destinations…" />
          </div>
          <div id="destinations-page-list" class="destination-grid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-bottom">
        <span>© 2026 Altis Voyage</span>
        <a href="/admin/login.html">Staff sign in</a>
      </div>
    </footer>

    <div id="cart-modal" class="cart-panel hidden"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
